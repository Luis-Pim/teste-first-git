# Ambiente local completo: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: investai
      POSTGRES_PASSWORD: investai # somente local; em produção use Secrets Manager
      POSTGRES_DB: investai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investai"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: [./backend/.env.example]
    environment:
      INVESTAI_DATABASE_URL: postgresql+psycopg://investai:investai@db:5432/investai
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
